[project]
name = "mentor-automator"
version = "0.1.0"
description = "Local supervised Moodle assistant with Telegram and Codex CLI"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50,<2", "aiogram>=3.17,<4", "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "filelock>=3.16,<4", "aiohttp>=3.11,<4"
]

[project.scripts]
mentor = "mentor_automator.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
